<style>

.cg{display:grid;grid-template-columns:repeat(7,1fr);gap:3px}.cd{min-height:58px;border-radius:8px;background:rgba(255,255,255,.03);padding:4px;font-size:11px;color:var(--mu);overflow:hidden}.cd.has{background:rgba(255,255,255,.08);color:var(--tx)}.cd b{display:block;font-size:10px;font-weight:600;margin-top:2px}.dots{display:flex;gap:2px;margin-top:3px;flex-wrap:wrap}.dots i{width:7px;height:7px;border-radius:50%}

<dialog id="dg"></dialog>
<script>
const $=s=>document.querySelector(s),P=['#e09f3a','#44939a','#c0452e','#a3d1be','#5f84ac','#e5d8a8','#8a5a9a','#b8651f'];
const eur=n=>new Intl.NumberFormat('de-DE',{style:'currency',currency:'EUR'}).format(n||0);
let S={tx:[],meta:{}};try{S=JSON.parse(localStorage.getItem('dt'))||S}catch(e){}
let tab='dash',opt={act:true,fc:true,cum:true,dim:'type',tag:'',per:'max',dtab:'w'},ch={};
const save=()=>{try{localStorage.setItem('dt',JSON.stringify(S))}catch(e){}};
const MN=['Jan','Feb','Mär','Apr','Mai','Jun','Jul','Aug','Sep','Okt','Nov','Dez'];
const tabs={dash:'Dashboard',dvd:'Dividenden · Übersicht',dvm:'Dividenden · Monatlich fortlaufend',dvy:'Dividenden · Monatlich pro Jahr',dva:'Dividenden · Akkumuliert',cal:'Dividendenkalender',ana:'Analyse',cash:'Kapitalfluss',hold:'Holdings',dck:'Datencheck',act:'Aktivitäten',det:'Details'};
$('#menu').onclick=e=>{const k=e.target.closest('[data-k]');if(k){tab=k.dataset.k;$('#sb').classList.remove('open');render()}};$('#bn').onclick=e=>{const b=e.target.closest('[data-n]');if(!b)return;if(b.dataset.n=='more'){$('#sb').classList.toggle('open');return}tab=b.dataset.n;$('#sb').classList.remove('open');render()};
document.addEventListener('click',e=>{if(!e.target.closest('#sb,#bn'))$('#sb').classList.remove('open')});$('#menu').addEventListener('click',e=>{if(e.target.closest('#demo,#exp,#clr'))$('#sb').classList.remove('open')});
const ym=d=>d.slice(0,7),key=t=>t.xid?'id:'+t.xid:[t.date,t.type,t.ticker,(+t.qty).toFixed(4),(+t.amount).toFixed(2)].join('|');
function holdings(){const h={};[...S.tx].sort((a,b)=>a.date<b.date?-1:1).forEach(t=>{if(!t.ticker||!['buy','sell','div'].includes(t.type))return;const x=h[t.ticker]||(h[t.ticker]={t:t.ticker,name:t.name,q:0,cost:0,div:0});
 if(t.type=='buy'){x.q+=t.qty;x.cost+=t.amount}else if(t.type=='sell'){const a=x.q?x.cost/x.q:0;x.cost-=a*t.qty;x.q-=t.qty}else x.div+=t.amount});
 return Object.values(h)}
function addM(d,n){const x=new Date(d.getFullYear(),d.getMonth()+n,1);return x.getFullYear()+'-'+String(x.getMonth()+1).padStart(2,'0')}
function forecast(n=12){const now=new Date(),out=[],H=holdings().filter(h=>h.q>0.0001);
 H.forEach(h=>{const m=S.meta[h.t]||{};const past=S.tx.filter(t=>t.type=='div'&&t.ticker==h.t);
  if(+m.dps>0){const f=+m.freq||4;let mo=(m.mo||'').split(',').map(Number).filter(x=>x>=1&&x<=12);
   if(!mo.length)mo=[...new Set(past.map(t=>+t.date.slice(5,7)))];if(!mo.length)mo=Array.from({length:f},(_,i)=>(i*12/f|0)+3).map(x=>(x-1)%12+1);
   for(let i=1;i<=n;i++){const k=addM(now,i);if(mo.includes(+k.slice(5)))out.push({ym:k,t:h.t,a:h.q*m.dps/f})}}
  else for(let i=1;i<=n;i++){const k=addM(now,i),k0=addM(now,(i-1)%12+1-12);const a=past.filter(t=>ym(t.date)==k0).reduce((s,t)=>s+t.amount,0);if(a)out.push({ym:k,t:h.t,a})}});
 return out}
const addD=(s,n)=>{const d=new Date(s+'T12:00:00');d.setDate(d.getDate()+n);return d.toISOString().slice(0,10)};
const exMatch=(t,p)=>{const m=S.meta[t]||{};if(!m.ev)return '';let b='';m.ev.ex.forEach(([d])=>{if(d<=p&&(new Date(p)-new Date(d))/864e5<=60&&d>b)b=d});return b};
const evLag=t=>{const m=S.meta[t]||{};if(!m.ev)return null;const L=[];S.tx.filter(x=>x.type=='div'&&x.ticker==t).forEach(x=>{const p=x.date.slice(0,10),e=exMatch(t,p);if(e)L.push(Math.round((new Date(p)-new Date(e))/864e5))});if(!L.length)return null;L.sort((a,b)=>a-b);return L[L.length>>1]};
const annOf=(t,k)=>{const nx=((S.meta[t]||{}).ev||{}).nx;if(!nx)return null;const lg=evLag(t),pay=nx.pay||(lg!=null?addD(nx.ex,lg):'');return pay&&ym(pay)==k?{d:pay,ex:nx.ex}:null};
const gw=()=>{try{return localStorage.getItem('divworker')||''}catch(e){return ''}};
let WR={};
let QT={};try{QT=JSON.parse(localStorage.getItem('divq')||'{}')}catch(e){}
let QS={t:0,n:0,of:0};
const qP=t=>(QT[t]||{}).p||0,mvOf=h=>qP(h.t)>0?h.q*qP(h.t):h.cost,
 qLine=h=>{const p=qP(h.t);if(!(p>0))return '';const mv=h.q*p,g=mv-h.cost,pc=(QT[h.t]||{}).pc,dd=pc>0?(p/pc-1)*100:null;return `<div class="mu" style="font-size:13px;margin-top:4px">Kurs ${eur(p)}${dd!=null?` <span class="${dd>=0?'gr':'neg'}">${dd>=0?'+':''}${dd.toFixed(2).replace('.',',')} %</span>`:''} · Wert ${eur(mv)} · <span class="${g>=0?'gr':'neg'}">${g>=0?'+':''}${eur(g)}${h.cost>0?' ('+(g/h.cost*100).toFixed(1).replace('.',',')+' %)':''}</span></div>`};
async function fetchQ(){const u=gw();if(!u)return;const H=holdings().filter(h=>h.q>0.0001);let n=0;const st=$('#wst');if(st)st.textContent='Rufe Kurse ab …';
 await Promise.all(H.map(async h=>{const isin=(S.tx.find(x=>x.ticker==h.t&&x.isin)||{}).isin;if(!isin)return;const q=QT[h.t]||{};
  try{const r=await fetch(`${u}/quote?isin=${encodeURIComponent(isin)}${q.sym?'&sym='+encodeURIComponent(q.sym):''}`),j=await r.json();if(j.ok&&j.eur>0){QT[h.t]={p:j.eur,pc:j.prevEur,c:j.cur,sym:j.sym,ts:j.time||Date.now()};n++}}catch(e){}}));
 try{localStorage.setItem('divq',JSON.stringify(QT))}catch(e){}
 QS={t:Date.now(),n,of:H.length};const st2=$('#wst');if(st2)st2.textContent=`Kurse: ${n} von ${H.length} Titeln aktualisiert.`;
 if(['dash','hold','det','dvd'].includes(tab)&&!$('#dg').open)render()}

function saveW(){const v=$('#wu').value.trim().replace(/[\/]+$/,'');try{localStorage.setItem('divworker',v);$('#wu').value=v;$('#wst').textContent=v?'Adresse gespeichert.':'Adresse gelöscht.'}catch(e){$('#wst').textContent='Speichern nicht möglich (privater Modus?).'}}
async function syncEv(){const u=gw(),st=$('#wst');if(!u){st.textContent='Bitte zuerst die Worker-Adresse speichern.';return}
 const H=holdings().filter(h=>h.q>0.0001);WR={};let ok=0,i=0;
 for(const h of H){i++;st.textContent=`Rufe ab … ${i}/${H.length}`;const isin=(S.tx.find(x=>x.ticker==h.t&&x.isin)||{}).isin;if(!isin){WR[h.t]='keine ISIN';continue}
  const m=S.meta[h.t]=S.meta[h.t]||{};try{const r=await fetch(`${u}/div?isin=${encodeURIComponent(isin)}${m.ysym?'&sym='+encodeURIComponent(m.ysym):''}`),j=await r.json();
   if(j.ok){m.ev={ex:j.divs.map(d=>[d.ex,d.amt]),nx:j.next||null,ts:Date.now()};m.ysym=j.sym;ok++;WR[h.t]=`✓ ${j.sym} · ${j.divs.length} Termine${j.next?' · nächster Ex-Tag '+j.next.ex:''}`}else WR[h.t]='✗ '+(j.error||'nichts gefunden')}catch(e){WR[h.t]='✗ Worker nicht erreichbar'}}
 save();st.textContent=`Fertig: ${ok} von ${H.length} Titeln aktualisiert.`;drawW()}

// ---- Import ----
const num=s=>parseFloat(String(s).replace(/[^\d.\-]/g,''));
function iso(s){let m=s.match(/(\d{4})-(\d{2})-(\d{2})/);if(m)return m[0];m=s.match(/(\d{2})[./](\d{2})[./](\d{4})/);return m?`${m[3]}-${m[2]}-${m[1]}`:null}
function parseLine(l){const d=iso(l);if(!d)return null;const a=l.match(/(market buy|limit buy|stop buy|stop limit buy|market sell|limit sell|stop sell|stop limit sell|dividend[^\s]*|buy|sell)/i);if(!a)return null;
 const type=/buy/i.test(a[1])?'buy':/sell/i.test(a[1])?'sell':'div';const rest=l.slice(l.toLowerCase().indexOf(a[1].toLowerCase())+a[1].length).trim().split(/\s+/);
 const tk=rest.findIndex(x=>/^[A-Z][A-Z0-9.]{0,6}$/.test(x));if(tk<0)return null;const nums=[],nm=[];rest.slice(tk+1).forEach(x=>{/^-?[\d,]*\.?\d+$/.test(x)?nums.push(num(x)):(!nums.length&&nm.push(x))});
 if(nums.length<2)return null;const total=Math.abs(nums[nums.length-1]);return{date:d,type,ticker:rest[tk],name:nm.join(' '),qty:Math.abs(nums[0]),price:nums[1],amount:total}}
function csvRows(t){const R=[];let r=[],c='',q=0;for(let i=0;i<t.length;i++){const h=t[i];if(q){if(h=='"'){if(t[i+1]=='"'){c+='"';i++}else q=0}else c+=h}else if(h=='"')q=1;else if(h==','||h==';'){r.push(c);c=''}else if(h=='\n'){r.push(c);R.push(r);r=[];c=''}else if(h!='\r')c+=h}
 if(c||r.length){r.push(c);R.push(r)}return R}
function parseCSV(txt){const R=csvRows(txt),hd=R[0].map(h=>h.trim().toLowerCase()),ix=n=>hd.findIndex(h=>h.startsWith(n)),
 I={t:ix('time'),a:ix('action'),k:ix('ticker'),n:ix('name'),q:ix('no. of'),p:ix('price'),g:ix('gross total'),nt:ix('net total'),id:ix('id'),isin:ix('isin'),cu:ix('currency (price'),fx:ix('exchange')};
 return R.slice(1).map(c=>{const a=c[I.a]||'',d=iso(c[I.t]||'');if(!d)return null;let type=null;
  if(/buy|scrip|spin/i.test(a))type='buy';else if(/sell/i.test(a))type='sell';else if(/^dividend/i.test(a))type='div';else if(/interest/i.test(a))type='int';else if(/deposit/i.test(a))type='dep';else if(/withdraw/i.test(a))type='wd';if(!type)return null;
  const g=Math.abs(num(c[I.g])||0),n=Math.abs(num(c[I.nt])||0);
  return{xid:c[I.id]||'',date:d,type,ticker:c[I.k]||'',isin:c[I.isin]||'',name:c[I.n]||'',qty:Math.abs(num(c[I.q])||0),price:(num(c[I.p])||0)/((c[I.cu]||'EUR')!='EUR'&&num(c[I.fx])>0?num(c[I.fx]):1),amount:(type=='div'||type=='int')?(n||g):g}}).filter(Boolean)}
const EU='AT BE BG CH CZ DE DK EE ES FI FR GB GR HR HU IE IT LT LU LV NL NO PL PT RO SE SI SK'.split(' '),AS='CN HK JP KR TW SG IN MY TH ID'.split(' ');
function autoMeta(t){if(S.meta[t.ticker]||!t.isin||!t.ticker)return;const cc=t.isin.slice(0,2);let country=cc;try{country=new Intl.DisplayNames('de',{type:'region'}).of(cc)}catch(e){}

async function parsePDF(buf){pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';const pdf=await pdfjsLib.getDocument({data:buf}).promise,out=[];
 for(let p=1;p<=pdf.numPages;p++){const tc=await(await pdf.getPage(p)).getTextContent(),rows={};tc.items.forEach(i=>{const y=Math.round(i.transform[5]/4);(rows[y]=rows[y]||[]).push([i.transform[4],i.str])});
  Object.keys(rows).sort((a,b)=>b-a).forEach(y=>{const t=parseLine(rows[y].sort((a,b)=>a[0]-b[0]).map(x=>x[1]).join(' ').replace(/\s+/g,' '));if(t)out.push(t)})}return out}
